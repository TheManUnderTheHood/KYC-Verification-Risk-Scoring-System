spring.application.name=KYC-Verification-and-Scoring-System
server.port=8080

# ==========================================
# CLOUD DATABASE (MYSQL) CONFIGURATION
# ==========================================
# Replace YOUR_CLOUD_HOST, YOUR_PORT, and defaultdb with your actual cloud details.
# Example: jdbc:mysql://mysql-kyc-project.aivencloud.com:25060/defaultdb?useSSL=true&serverTimezone=UTC
spring.datasource.url=

# Your cloud database username
spring.datasource.username=

# Your cloud database password
spring.datasource.password=

# The driver used to connect to MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / HIBERNATE CONFIGURATION
# ==========================================
# Tell Hibernate to automatically create or update our database tables based on our Java Entities
spring.jpa.hibernate.ddl-auto=update
# Print the SQL queries generated by Hibernate in the console (Great for debugging/learning)
spring.jpa.show-sql=true
# Format the printed SQL queries so they are easy to read
spring.jpa.properties.hibernate.format_sql=true
# Specify the SQL dialect so Hibernate knows exactly how to talk to MySQL 8
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==========================================
# JWT (JSON WEB TOKEN) CONFIGURATION
# ==========================================
# A highly secure, long random string used to sign our JWTs. NEVER share this in production!
# For learning, we hardcode it here.
jwt.secret=9a4f2c8d3b7a1e6f45c8a0b3f267d8b1d4e6f3c8a9d2b5f8e3a9c8b5f6v8a3d9
# How long the token is valid for in milliseconds (86400000 ms = 24 Hours)
jwt.expiration=86400000

# ==========================================
# FILE UPLOAD CONFIGURATION
# ==========================================
# Where we will store uploaded KYC documents (creates a folder named 'uploads' in project root)
file.upload-dir=uploads
# Max file size allowed per upload
spring.servlet.multipart.max-file-size=5MB
# Max total request size allowed
spring.servlet.multipart.max-request-size=5MB

springdoc.swagger-ui.path=/swagger-ui.html

# ==========================================
# STRIPE PAYMENT GATEWAY CONFIGURATION
# ==========================================
stripe.api.environment=https://api.stripe.com/v1
stripe.api.secret-key=
stripe.currency=inr
stripe.mock-on-auth-failure=true
wallet.activation.amount.paise=50000
wallet.activation.success-url=http://localhost:5173/dashboard
wallet.activation.cancel-url=http://localhost:5173/dashboard
