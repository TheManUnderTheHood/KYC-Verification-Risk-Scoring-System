spring.application.name=KYC-Verification-and-Scoring-System
server.port=8080

# ==========================================
# CLOUD DATABASE (MYSQL) CONFIGURATION
# ==========================================
# Replace YOUR_CLOUD_HOST, YOUR_PORT, and defaultdb with your actual cloud details.
# Example: jdbc:mysql://mysql-kyc-project.aivencloud.com:25060/defaultdb?useSSL=true&serverTimezone=UTC
spring.datasource.url=

# Your cloud database username
spring.datasource.username=

# Your cloud database password
spring.datasource.password=

# The driver used to connect to MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / HIBERNATE CONFIGURATION
# ==========================================
# Tell Hibernate to automatically create or update our database tables based on our Java Entities
spring.jpa.hibernate.ddl-auto=update
# Print the SQL queries generated by Hibernate in the console (Great for debugging/learning)
spring.jpa.show-sql=true
# Format the printed SQL queries so they are easy to read
spring.jpa.properties.hibernate.format_sql=true
# Specify the SQL dialect so Hibernate knows exactly how to talk to MySQL 8
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
